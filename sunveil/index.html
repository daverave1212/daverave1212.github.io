  <script>

    async function populateQuestLog() {
        const quests = await fetchCsvRowsAsync(QUESTS_URL)
        
        document.querySelector('#number-of-quests').innerHTML = quests.length

        const QUEST_SYMBOL = {
            'Main Quest': '✦',
            'Personal Quest': '!',
            'Secondary Quest': '!',
        }

        const questsByLocation = {}
        for (const row of quests) {
            const [name, type, location, description] = row
            if (questsByLocation[location] == null) {
                questsByLocation[location] = []
            }
            questsByLocation[location].push(row)
        }
        console.log({questsByLocation})

        function makeQuestHeader(text, number) {
            return dom(`
                <div class="group-heading">
                    <span>${text}</span>
                    <span>${number}</span>
                </div>
            `)
        }
        function makeQuestArticle(row) {
            const [name, type, location, description] = row
            const symbol = QUEST_SYMBOL[type]
            const symbolClass = type == 'Secondary Quest'? 'secondary': ''
            const renderedDescription = description.split('\n').join('<br>')
            return dom(`
                <article class="quest-item">
                    <span class="quest-symbol ${symbolClass}">${symbol}</span>
                    <div class="quest-copy">
                        <strong>${name}</strong>
                        <span>${renderedDescription}</span>
                    </div>
                    <!--span class="quest-level">18</span-->
                </article>
            `)
        }

        const questHolderDiv = document.querySelector('.panel.quest-sidebar')
        const logDiv = dom(`<div class="quest-scroll"></div>`)
        questHolderDiv.appendChild(logDiv)
        for (const [location, rows] of Object.entries(questsByLocation)) {
            const sectionDiv = dom(`<section class="quest-group"></section>`)
            logDiv.appendChild(sectionDiv)
            const sectionHeader = makeQuestHeader(location, rows.length)
            sectionDiv.appendChild(sectionHeader)
            for (const row of rows) {
                const questDiv = makeQuestArticle(row)
                sectionDiv.appendChild(questDiv)
            }
        }
        

    }

    populateQuestLog()

  </script>
